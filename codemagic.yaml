# Codemagic builds the iPhone app on a rented Mac and sends it to TestFlight.
# Set up once in Codemagic (codemagic.io), never in this file:
#   - Team settings > Integrations > Developer Portal: an App Store Connect API key, named "Earthworx"
#   - this app's numeric Apple ID (App Store Connect > the app > App Information) in APP_STORE_APPLE_ID below
# What testers see under "What to Test" in TestFlight comes from TESTFLIGHT_NOTES.txt.
workflows:
  ios-testflight: &ios
    name: iPhone app to TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Earthworx
    environment:
      groups:
        - ios_signing # CERTIFICATE_PRIVATE_KEY (base64 of the .pem), kept secret in Codemagic (Environment variables)
      vars:
        APP_STORE_APPLE_ID: 6824078099 # Earthworx Sim in App Store Connect
      node: 22
      xcode: latest
    triggering:
      events: [] # built by hand from Codemagic, not on every push
    scripts:
      - name: Store builds only - no Google test ads
        # a store build (VITE_CHANNEL=live) must carry the real AdMob app ID and ad units, never Google's test ones
        script: |
          set -e
          # to test purchases before the AdMob IDs are in, start the build with ALLOW_TEST_ADS=1 (never one you submit)
          if [ "$VITE_CHANNEL" = "live" ] && [ "$ALLOW_TEST_ADS" != "1" ]; then
            if grep -q "ca-app-pub-3940256099942544" app/ios/App/App/Info.plist; then echo "Info.plist still has Google's TEST AdMob app ID"; exit 1; fi
            if grep -q "const LIVE = IOS ? { reward: ''" app/src/ads.ts; then echo "app/src/ads.ts has no real iPhone ad unit IDs yet"; exit 1; fi
          fi
      - name: Install the game's packages
        script: cd app && npm ci
      - name: Build the game
        script: cd app && npm run build
      - name: Copy it into the iPhone project
        script: cd app && npx cap sync ios
      - name: Signing (fetched from Apple each build)
        script: |
          set -e
          # the key is kept in Codemagic as one line of base64, so pasting can't mangle it
          export CERT_KEY="$(printf '%s' "$CERTIFICATE_PRIVATE_KEY" | tr -d '[:space:]' | base64 --decode)"
          keychain initialize
          app-store-connect fetch-signing-files "biz.ddes.earthmoving" --type IOS_APP_STORE --certificate-key=@env:CERT_KEY --create
          keychain add-certificates
          xcode-project use-profiles --project "app/ios/App/App.xcodeproj"
      - name: Number this build one past the last on TestFlight
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          cd app/ios/App && agvtool new-version -all $((LAST + 1))
      - name: Build the app
        script: xcode-project build-ipa --project "app/ios/App/App.xcodeproj" --scheme "App"
      - name: Send it to TestFlight, with the notes for testers
        # uploads the app, waits for Apple to process it, then fills in TestFlight's "What to Test" from
        # TESTFLIGHT_NOTES.txt (edit that file for each round of changes; 4,000 characters at most).
        # No --testflight: your own team gets it without Apple's beta review; add it once outside testers are in.
        script: |
          set -e
          app-store-connect publish --path "build/ios/ipa/*.ipa" --whats-new @file:TESTFLIGHT_NOTES.txt --max-build-processing-wait 40
    artifacts:
      - build/ios/ipa/*.ipa

  # The store build: packs are sold, ads use the real AdMob units. It goes to TestFlight first (purchases there
  # use Apple's sandbox, nothing is charged), and that same build is the one you submit for App Store review.
  ios-store:
    <<: *ios
    name: iPhone store build (to TestFlight, then App Store review)
    environment:
      groups:
        - ios_signing
      vars:
        APP_STORE_APPLE_ID: 6824078099
        VITE_CHANNEL: live
      node: 22
      xcode: latest
